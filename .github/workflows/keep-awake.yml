name: Keep Streamlit app awake

on:
  schedule:
    # Every 4 hours (UTC). Streamlit Community Cloud puts apps to sleep after
    # about 12 hours without traffic, so this leaves room for delayed runs.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Visit the app
        run: python .github/scripts/keep_awake.py

      - name: Save screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-screenshot
          path: keep_awake.png
          retention-days: 3
          if-no-files-found: ignore
